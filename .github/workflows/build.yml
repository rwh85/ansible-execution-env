name: Build, Test, Scan & Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/rwh85/ansible-execution-env

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ansible-execution-env:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          echo "=== Verifying Ansible Execution Environment ==="
          docker run --rm --entrypoint "" ansible-execution-env:latest ansible --version
          docker run --rm --entrypoint "" ansible-execution-env:latest ansible-galaxy collection list
          docker run --rm --entrypoint "" ansible-execution-env:latest python3 -c "import paramiko, jmespath, yaml, cryptography; print('Python packages OK')"
          docker run --rm --entrypoint "" ansible-execution-env:latest sh -c "which sshpass && which ssh && which git && echo 'System tools OK'"
          echo "--- Security checks ---"
          docker run --rm --entrypoint "" ansible-execution-env:latest sh -c 'echo "uid=$(id -u)"; [ "$(id -u)" -ne 0 ] && echo "Non-root OK" || (echo "FAIL: running as root" && exit 1)'
          echo "=== All checks passed ==="

  scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ansible-execution-env:latest
          cache-from: type=gha

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ansible-execution-env:latest
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL

  push:
    name: Push to GHCR
    runs-on: ubuntu-latest
    needs: [build-and-test, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
